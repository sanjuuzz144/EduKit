<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR Code Generator - EduKit</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .qr-page{
            min-height:calc(100vh - 70px);
            padding:48px 18px 70px;
            background:
                radial-gradient(circle at 8% 12%,rgba(124,58,237,.13),transparent 30%),
                radial-gradient(circle at 92% 18%,rgba(236,72,153,.11),transparent 30%);
        }
        .qr-wrap{max-width:820px;margin:auto}
        .qr-head{text-align:center;margin-bottom:26px}
        .qr-badge{
            display:inline-flex;padding:8px 13px;border-radius:999px;
            background:#f5f3ff;color:#6d28d9;font-size:13px;font-weight:800;
        }
        .qr-head h1{
            font-size:clamp(32px,5vw,46px);margin:14px 0 8px;
            letter-spacing:-1.3px;
        }
        .qr-head p{color:#667085;margin:0;line-height:1.6}
        .qr-card{
            display:grid;grid-template-columns:1fr 300px;gap:28px;
            background:rgba(255,255,255,.94);
            border:1px solid #e6e9f2;border-radius:28px;padding:30px;
            box-shadow:0 22px 60px rgba(30,41,90,.11);
        }
        .qr-form{padding:8px 0}
        .qr-label{
            display:block;font-size:13px;font-weight:800;
            color:#344054;margin-bottom:9px;
        }
        .qr-input{
            width:100%;height:56px;padding:0 16px;
            border:1px solid #dfe4ee;border-radius:15px;
            background:#fff;color:#172033;font:inherit;font-size:15px;
            outline:none;
        }
        .qr-input:focus{
            border-color:#7c3aed;
            box-shadow:0 0 0 4px rgba(124,58,237,.10);
        }
        .qr-btn{
            width:100%;height:54px;margin-top:16px;border:0;border-radius:15px;
            color:#fff;font-weight:800;font-size:15px;cursor:pointer;
            background:linear-gradient(135deg,#7c3aed,#ec4899);
            box-shadow:0 12px 28px rgba(124,58,237,.20);
            transition:.2s;
        }
        .qr-btn:hover{transform:translateY(-2px)}
        .qr-preview{
            min-height:300px;border-radius:22px;
            background:linear-gradient(135deg,#faf5ff,#fdf2f8);
            border:1px solid #eadcff;
            display:flex;align-items:center;justify-content:center;
            padding:20px;text-align:center;
        }
        #qrcode{padding:12px;background:white;border-radius:14px;box-shadow:0 10px 25px rgba(30,41,90,.08)}
        .qr-placeholder{color:#8b5cf6;font-size:13px;line-height:1.5}
        .qr-tip{
            margin-top:18px;padding:13px 15px;border-radius:14px;
            background:#faf5ff;color:#6b21a8;font-size:12px;line-height:1.5;
        }
        .qr-back{
            display:block;text-align:center;margin-top:22px;
            color:#5b5ce2;font-weight:800;font-size:14px;
        }
        @media(max-width:700px){
            .qr-page{padding:30px 14px 50px}
            .qr-card{grid-template-columns:1fr;padding:22px}
            .qr-preview{min-height:270px}
        }
    </style>
</head>
<body>
<header>
    <a href="/" class="logo">🎓 EduKit</a>
    <span style="color:#667085;font-size:13px">Student tools, made simple.</span>
</header>

<main class="qr-page">
    <div class="qr-wrap">
        <div class="qr-head">
            <span class="qr-badge">🔗 Quick Sharing Tool</span>
            <h1>QR Code Generator</h1>
            <p>Turn text or any website URL into a QR code instantly.</p>
        </div>

        <div class="qr-card">
            <div class="qr-form">
                <label class="qr-label" for="qrText">Text or Website URL</label>
                <input class="qr-input" id="qrText" type="text"
                       placeholder="https://example.com"
                       onkeydown="if(event.key==='Enter') generateQR()">

                <button class="qr-btn" onclick="generateQR()">
                    ✨ Generate QR Code
                </button>

                <div class="qr-tip">
                    💡 You can enter a website link, text, contact information,
                    or any short message.
                </div>
            </div>

            <div class="qr-preview">
                <div id="qrcode">
                    <div class="qr-placeholder">
                        📱<br>
                        Your QR code<br>
                        will appear here
                    </div>
                </div>
            </div>
        </div>

        <a class="qr-back" href="/">← Back to EduKit</a>
    </div>
</main>

<script>
function generateQR() {
    const text = document.getElementById("qrText").value;
    const qr = document.getElementById("qrcode");

    qr.innerHTML = "";

    if (text.trim() === "") {
        alert("Please enter some text or a URL.");
        return;
    }

    new QRCode(qr, {
        text: text,
        width: 220,
        height: 220
    });
}
</script>
</body>
</html>
